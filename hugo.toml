baseURL = 'https://waerin.me/'
locale = 'en-us'
title = 'Patch Notes'
theme = "shibui"

[params.author]
  name = "Waerin"
  email = "waerin@gmail.com"
  # Enable/disable comments on posts (default: true)
  comments = true

  # Default table of contents visibility per page (default: true)
  # Can be overridden per-page with `toc: false` in front matter
  showtoc = true

  # Show estimated reading time on posts (default: true)
  showreadingtime = true

  # Show last modified date on posts (default: false)
  showlastmod = false

  # Social links (optional)
  twitterHandle = "username"
  ogImage = "/images/og-image.jpg"
[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Write-ups"
    url = "/writeups/"
    weight = 2  
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

enableRobotsTXT = true